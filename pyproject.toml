[project]
name = "tech-challenge-3"
version = "0.1.0"
description = "Triagem de urgência de laudos médicos: TF-IDF + Logistic Regression servido via FastAPI com ONNX Runtime"
readme = "README.md"
authors = [{ name = "Beatriz-Ferrante", email = "beatriz.ferrante37@gmail.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "skl2onnx>=1.18",
    "onnxruntime>=1.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
pytest = ">=8.0"
httpx = ">=0.27"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
